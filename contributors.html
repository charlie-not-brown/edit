<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>最近更新 · 条目编辑器</title>
  <link rel="icon" href="https://i.ibb.co/NnYsfQcn/bird.gif">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="bird-img" src="https://i.ibb.co/NnYsfQcn/bird.gif" alt="" /><span>最近更新</span></div>
  <nav class="nav"><a href="./index.html">编辑界面</a><a href="./admin.html">审核后台</a><a class="active" href="./contributors.html">最近更新</a></nav>
</header>
<main class="page narrow">
  <h1>最近更新</h1>
  <p class="hint">这里显示已通过的新增、修改与删除记录；匿名投稿也会进入更新日志。</p>
  <div id="logList" class="log-list"><div class="sub-card muted">读取中……</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function target(ch){return ch.kind==='new'?(ch.newData?.name||'未命名新条目'):(ch.oldData?.name||ch.targetId||'未命名条目')}
function action(ch){return ch.kind==='new'?'新增':(ch.kind==='delete'?'删除':'修改')}
function who(item){return item.contributor?.anonymous?'匿名贡献者':(item.contributor?.name||'未署名贡献者')}
async function loadRemoteLogs(){
  const res=await fetch('./api/logs',{cache:'no-store'});
  if(!res.ok) throw new Error('无法读取最近更新');
  const data=await res.json();
  return data.logs||[];
}
function loadLocalLogs(){
  try{
    const subs=JSON.parse(localStorage.getItem('td_contrib_submissions_v5'))||[];
    const logs=[];
    subs.forEach((s,si)=>(s.changes||[]).forEach((ch,ci)=>{if(ch.status==='approved')logs.push({id:ch.changeId||s.id+'-'+(ci+1),submissionId:s.id,createdAt:ch.reviewedAt||s.createdAt,contributor:s.contributor,change:ch,local:true,si,ci})}));
    return logs;
  }catch(e){return []}
}
function render(logs){
  logs=(logs||[]).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  $('#logList').innerHTML=logs.length?logs.map(item=>{
    const ch=item.change||item;
    return `<div class="log-card"><div class="log-avatar">${item.contributor?.avatar?`<img class="avatar" src="${esc(item.contributor.avatar)}" onerror="this.style.display='none'">`:'<span>✧</span>'}</div><div class="log-main"><div><b>${esc(who(item))}</b> ${action(ch)}了 <b>${esc(target(ch))}</b></div><div class="hint">${esc(item.id||ch.changeId||item.submissionId||'')} · ${item.createdAt?new Date(item.createdAt).toLocaleString():''}${ch.kind==='edit'?' · 字段：'+(ch.fields||[]).join('、'):''}</div></div><button class="mini-btn danger log-delete" data-id="${esc(item.id||'')}" ${item.local?'data-local="1"':''}>删除</button></div>`
  }).join(''):'<div class="sub-card muted">暂无更新记录。</div>';
  document.querySelectorAll('.log-delete').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('确认删除这条更新记录？')) return;
    if(btn.dataset.local){
      alert('本地测试记录请到审核后台清理。'); return;
    }
    const secret=prompt('管理员密钥'); if(!secret) return;
    try{
      const res=await fetch('./api/admin/delete-log',{method:'POST',headers:{'content-type':'application/json','x-admin-secret':secret},body:JSON.stringify({id:btn.dataset.id})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||!data.ok) throw new Error(data.error||'删除失败');
      await init();
    }catch(e){alert('删除失败：'+e.message)}
  });
}
async function init(){
  try{render(await loadRemoteLogs())}
  catch(e){render(loadLocalLogs())}
}
init();
</script>
</body>
</html>
