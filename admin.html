<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核后台 · 条目编辑器</title>
<link rel="icon" href="./assets/bird.gif"><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div class="brand"><img class="bird-img" src="./assets/bird.gif" alt="" /><span>审核后台</span></div><nav class="nav"><a href="./index.html">编辑界面</a><a class="active" href="./admin.html">审核后台</a><a href="./contributors.html">贡献日志</a></nav></header>
<main class="page narrow"><h1>审核后台</h1><div id="loginBox" class="sub-card"><label>管理员密钥</label><input id="secret" class="text-input" ><button id="login" class="blue-btn" style="margin-top:10px">进入</button></div><div id="adminPanel" hidden><div class="dev-tools"><button class="mini-btn" id="cleanupOld">清理30天前已处理记录</button><span class="cleanup-note">正式部署时可改成自动定期清理。</span></div><div id="submissions"></div></div></main>
<script>
const KEY='td_contrib_submissions_v5'; const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s)); const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={name:'名称',portal:'传送门',importance:'重要性',hanhua:'汉化',relations:'关系性',notes:'备注',pageContent:'页面内容',pageContentRaw:'页面内容'};
function getSubs(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}} function setSubs(v){localStorage.setItem(KEY,JSON.stringify(v))}
function tags(arr,colors={}){return (arr&&arr.length)?arr.map(t=>`<span class="tag tag-${colors[t]||'default'}">${esc(t)}</span>`).join(''):'<span class="empty">空</span>'}
function val(v,colors){if(Array.isArray(v))return tags(v,colors); if((v||'').startsWith('<'))return '<span class="muted">页面内容 HTML</span>'; return esc(v||'')||'<span class="empty">空</span>'}
function stateText(s){return {pending:'待审核',approved:'已通过',rejected:'已拒绝'}[s||'pending']||s}
function render(){const subs=getSubs(); $('#submissions').innerHTML=subs.length?subs.map((s,i)=>card(s,i)).join(''):'<div class="sub-card muted">暂无投稿。</div>'; bindActions();}
function card(s,i){const changes=s.changes||[]; const stat={pending:0,approved:0,rejected:0}; changes.forEach(c=>stat[c.status||'pending']=(stat[c.status||'pending']||0)+1);return `<div class="sub-card"><div class="sub-head"><div><b>${esc(s.id)}</b><div class="hint">${new Date(s.createdAt).toLocaleString()} · ${esc(s.contributor?.anonymous?'匿名':(s.contributor?.name||'匿名'))} · 待审 ${stat.pending||0} / 通过 ${stat.approved||0} / 拒绝 ${stat.rejected||0}</div></div>${contribCopy(s,i)}</div>${changes.map((ch,j)=>changeCard(ch,s.colors||{},i,j,s)).join('')}</div>`}
function contribCopy(s,i){const c=s.contributor||{}; if(c.anonymous||!c.show)return ''; const text=`贡献者：${c.name||'未署名贡献者'}\n头像：${c.avatar||'(无)'}\n邮箱：${c.email||'(无)'}\n投稿编号：${s.id}`; return `<button class="mini-btn" data-copy="${esc(text)}">复制贡献者信息</button>`}
function changeCard(ch,colors,i,j,s){const status=ch.status||'pending'; const id=ch.changeId||`${s.id}-${j+1}`; return `<div class="change-card change-${status}"><div class="change-head"><div><b>${esc(id)}</b> <span class="status-pill">${stateText(status)}</span></div><div>${status==='pending'?`<button class="mini-btn" data-i="${i}" data-j="${j}" data-status="approved">通过</button> <button class="mini-btn danger" data-i="${i}" data-j="${j}" data-status="rejected">拒绝</button>`:''}</div></div>${changeBody(ch,colors)}</div>`}
function changeBody(ch,colors){
 if(ch.kind==='new')return `<h3>新增条目</h3><div class="new-position">建议位置：${esc(ch.position?.afterName||'开头')} 之后${ch.position?.beforeName?'，'+esc(ch.position.beforeName)+' 之前':''}</div><table class="diff-table">${Object.entries(ch.newData||{}).filter(([k])=>!['id','section','order','portalLinks'].includes(k)).map(([k,v])=>`<tr><td>${esc(labels[k]||k)}</td><td class="diff-new">${val(v,colors)}</td></tr>`).join('')}</table>`;
 if(ch.kind==='delete')return `<h3>删除条目：${esc(ch.oldData?.name||ch.targetId)}</h3><div class="new-position">通过后请手动在 Notion 正式库中删除/归档这一条。</div><table class="diff-table"><tr><td>名称</td><td class="diff-old">${esc(ch.oldData?.name||'')}</td></tr><tr><td>传送门</td><td class="diff-old">${val(ch.oldData?.portal,colors)}</td></tr></table>`;
 return `<h3>修改条目：${esc(ch.oldData?.name||ch.targetId)}</h3><table class="diff-table">${(ch.fields||[]).map(f=>`<tr><td>${esc(labels[f]||f)}</td><td class="diff-old">${val(ch.oldData?.[f],colors)}</td><td class="diff-new">${val(ch.newData?.[f],colors)}</td></tr>`).join('')}</table>`}
function bindActions(){
  $$('[data-status]').forEach(b=>b.onclick=()=>{const subs=getSubs(); const ch=subs[+b.dataset.i].changes[+b.dataset.j]; ch.status=b.dataset.status; ch.reviewedAt=new Date().toISOString(); const changes=subs[+b.dataset.i].changes||[]; subs[+b.dataset.i].status=changes.every(c=>c.status&&c.status!=='pending')?'reviewed':'pending'; setSubs(subs); render()});
  $$('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy); alert('已复制。')}catch(e){prompt('复制这段内容：',b.dataset.copy)}});
}
function login(){if($('#secret').value==='tim1989'){$('#loginBox').hidden=true;$('#adminPanel').hidden=false;render()}else alert('密钥不对')}
$('#login').onclick=login; $('#secret').addEventListener('keydown',e=>{if(e.key==='Enter')login()}); $('#cleanupOld').onclick=()=>{const now=Date.now(), cutoff=30*24*60*60*1000; const before=getSubs(); const after=before.filter(s=>{const changes=s.changes||[]; if(!changes.length||!changes.every(c=>c.status&&c.status!=='pending'))return true; const last=Math.max(...changes.map(c=>new Date(c.reviewedAt||s.createdAt).getTime())); return now-last<cutoff;}); setSubs(after); alert(`已清理 ${before.length-after.length} 条 30 天前已处理投稿。`); render();};
</script></body></html>
