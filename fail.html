<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>提交失败 · 条目编辑器</title>
  <link rel="icon" href="https://i.ibb.co/NnYsfQcn/bird.gif" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="success-page fail-page">
  <main class="success-main">
    <img class="success-bird" src="https://i.ibb.co/NnYsfQcn/bird.gif" alt="" />
    <h1>提交失败，请重新提交<br>或复制内容重试</h1>
    <div class="success-id">提交编号：<span id="failId">TD-----</span></div>
    <p>可能是通知接口或写入暂时失败。<br>你可以再次提交，或复制本次提交内容手动保存。</p>
    <div class="fail-actions">
      <button class="success-link" id="retrySubmit" type="button">重新提交</button>
      <button class="success-link" id="copyPayload" type="button">复制本次提交内容</button>
      <a class="success-link" href="./index.html">返回编辑器</a>
    </div>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('id') || 'TD-----';
    document.getElementById('failId').textContent = id;
    function getPayload(){
      try{return JSON.parse(sessionStorage.getItem('td_failed_submission')||sessionStorage.getItem('td_last_submission')||'null')}catch(e){return null}
    }
    document.getElementById('copyPayload').onclick=async()=>{
      const payload=getPayload();
      const text=payload?JSON.stringify(payload,null,2):'没有找到本次提交内容。';
      try{await navigator.clipboard.writeText(text); alert('已复制。')}catch(e){prompt('复制这段内容：',text)}
    };
    document.getElementById('retrySubmit').onclick=async()=>{
      const payload=getPayload();
      if(!payload){alert('没有找到本次提交内容，请返回编辑器重新提交。');return;}
      const btn=document.getElementById('retrySubmit'); btn.disabled=true; btn.textContent='提交中…';
      try{
        const res=await fetch('./api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
        const data=await res.json().catch(()=>({}));
        if(!res.ok || !data.ok) throw new Error(data.error||'submit failed');
        sessionStorage.removeItem('td_failed_submission'); sessionStorage.removeItem('td_last_submission');
        location.href='success.html?id='+encodeURIComponent(data.id||payload.id||id);
      }catch(e){
        alert('重新提交仍然失败。可以先复制内容保存。');
      }finally{btn.disabled=false; btn.textContent='重新提交';}
    };
  </script>
</body>
</html>
